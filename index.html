<!DOCTYPE html>
<!-- Start-->
<html lang="es">

    <!-- Head Start-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> QuebradaPorte </title>
    <link rel="Stylesheet" href="Sstilo.css">
</head>
<!-- Head finish Body Start-->
<body >
    
    <header>
         <div class="logo">
        <img src="images/rio.png" alt="Salvemos los arroyo">
        <h1>  EcoHato </h1>
    </div>

    <nav class="navbar">
        <a href="#" id="btnInicio"> <img src="Images/boton-de-inicio.png" width="32px" height="32px"> Inicio </a>
        <a href="#" id="btnReportes">  <img src="Images/reporte-de-negocios.png"> Reportes</a>
        <a id ="Acerca" > <img src="Images/acerca-de.png"> <u> Acerca de </u> </a>
    </nav>

    <div class="header-message">
<img src="Images/hoja.png" alt="error" > 
<p> quebradas limpias,<br> Entorno más saludables</p>
    </div>
    </header>
    <main class="panel">
    <section class="card tab active" id="tab1">
        <div id="loginContenido">
            <div class="card-head">
                <div>
                    <h2>Iniciar Sesión</h2>
                    <p> <b>Accede a tu cuerta para poder reportar reportar </b></p>
                </div>
            </div>

            <form class="login-form">
                <label class="field">
                    <img src="Images/correo.png" alt="" height="24px" width="24px">
                    <input type="text" id = "Usu"placeholder="Usuario">
                </label>

                <label class="field">
                    <img src="Images/candado.png" alt="" height="24px" width="24px">
                    <input type="password" id = "Contra" placeholder="Contraseña">
                </label>

                <button class="btn btnIni" id = "Inicio" type="submit"> Iniciar Sesión </button>
            </form>
            <br><hr><br>
            <p class="Registro" id = "Regi">¿No tienes una cuenta? <a> Regístrate</a></p>
        </div>
        <p class="sesion-activa" id="sesionActiva" hidden></p>
    </section>

    <section class="card tab" id="tab2">
        <div class="card-head">
            <div>
                <h2>Enviar Reporte</h2>
                <p>Reporta la basura o contaminación en el lago</p>
            </div>
        </div>

        <form class="login-form">
            <label class="field field-report">
                <textarea id="TextR" placeholder="Escribe tu reporte" ></textarea>
            </label> 
            <br>
            <button class="btn btnIni" id="Reporte" type="button" > Crear Reporte</button>
        </form>
        <br>
             <form class ="login-forme">
        <label class="field field-report" id = labelPtrm>
                <textarea id="listaReportes" placeholder="Los reportes enviados aparecerán aquí" readonly style="bottom: 10px;"></textarea>
            </label>
        </form>
    </section>
        
</main>
        


      
        


        <script src = "index.js"></script>

    <!-- Body Finish-->
</body >

<!-- Fin-->
